<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PARTNER_NAME}} — Solution Package</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Salesforce Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.6; color: #1a1a1a; background: #f4f6fb;
    }

    .page-wrapper {
      max-width: 1000px; margin: 32px auto; background: #ffffff;
      border-radius: 8px; box-shadow: 0 2px 16px rgba(3,45,96,0.10); overflow: hidden;
    }

    /* HERO HEADER */
    .hero { background: #032d60; color: #ffffff; padding: 44px 48px 38px; }
    .hero .eyebrow {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: #7db8f7; margin-bottom: 8px;
    }
    .hero h1 { font-size: 30px; font-weight: 700; line-height: 1.15; margin-bottom: 18px; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 22px; font-size: 13px; color: #cfe2fb; align-items: center; }
    .hero-meta .stage-badge {
      display: inline-block; background: #0176d3; color: #fff; font-size: 11px;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 3px 10px; border-radius: 12px;
    }

    /* CARD GRID */
    .grid-wrap { padding: 36px 48px 20px; }
    .grid-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: #444444; margin-bottom: 18px;
    }
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
    }

    .card {
      border: 1px solid #d8e0ec; border-radius: 8px; padding: 20px 20px 18px;
      display: flex; flex-direction: column; background: #ffffff;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .card:hover { box-shadow: 0 4px 18px rgba(3,45,96,0.12); transform: translateY(-2px); }

    .card-kind {
      align-self: flex-start; font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em; color: #0176d3;
      background: #eaf2fd; padding: 3px 9px; border-radius: 10px; margin-bottom: 12px;
    }
    .card-title { font-size: 17px; font-weight: 700; color: #032d60; margin-bottom: 7px; }
    .card-desc { font-size: 13.5px; color: #444444; flex: 1; margin-bottom: 16px; }

    .card-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-block; font-size: 12.5px; font-weight: 700; text-decoration: none;
      padding: 7px 14px; border-radius: 6px; letter-spacing: 0.02em;
    }
    .btn-view { background: #0176d3; color: #ffffff; }
    .btn-view:hover { background: #014486; }
    .btn-md { background: #ffffff; color: #0176d3; border: 1px solid #0176d3; }
    .btn-md:hover { background: #eaf2fd; }

    .footer {
      background: #032d60; color: #7db8f7; font-size: 12px;
      text-align: center; padding: 16px 40px; margin-top: 26px;
    }

    @media print {
      @page { margin: 0.7in; size: letter; }
      body { background: #ffffff; }
      .page-wrapper { box-shadow: none; border-radius: 0; margin: 0; max-width: 100%; }
      .hero, .stage-badge, .card-kind { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .card { break-inside: avoid; }
      .btn { border: 1px solid #0176d3; color: #0176d3 !important; background: #fff !important; }
      .footer { background: none; color: #444444; border-top: 1px solid #d8e0ec; }
    }
  </style>
</head>
<body>
<div class="page-wrapper">

  <header class="hero">
    <div class="eyebrow">Salesforce ISV Partner · OG Tech Strategy</div>
    <h1>{{PARTNER_NAME}} — Solution Package</h1>
    <div class="hero-meta">
      <span>{{ARTIFACT_COUNT}} artifacts</span>
      <span>{{PACKAGE_DATE}}</span>
      <span class="stage-badge">{{OPPORTUNITY_STAGE}}</span>
    </div>
  </header>

  <div class="grid-wrap">
    <div class="grid-title">Artifacts</div>
    <div class="card-grid">
{{ARTIFACT_CARDS}}
    </div>
  </div>

  <footer class="footer">
    Generated by pov-builder skill | {{PACKAGE_DATE}}
  </footer>

</div>

<!-- =====================================================================
     CARD TEMPLATE — repeat one block per generated artifact inside
     .card-grid (replaces {{ARTIFACT_CARDS}}). All links are RELATIVE
     filenames in the same directory as this index.

     - Always include the "View ↗" button (every artifact now has an HTML view).
     - Include the "Markdown ↓" button ONLY when a Markdown source exists
       (POV, MVP Build Plan, Red Team, Partner Readiness Scorecard).
       Omit it for HTML-native artifacts (Investor, Infographic, Marketecture).

     <div class="card">
       <span class="card-kind">KIND</span>
       <h3 class="card-title">TITLE</h3>
       <p class="card-desc">DESC</p>
       <div class="card-actions">
         <a class="btn btn-view" href="SLUG-artifact.html">View ↗</a>
         <a class="btn btn-md" href="SLUG-artifact.md">Markdown ↓</a>
       </div>
     </div>

     Suggested KIND tags: Core (POV) · Build (MVP) · Risk (Red Team) ·
     Sales (Investor) · Visual (Infographic) · Readiness (Scorecard) ·
     Architecture (Marketecture)
===================================================================== -->
</body>
</html>
